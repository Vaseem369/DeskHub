<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard</title>

  <link
    rel="stylesheet"
    href="../styles/main.css"
  />
</head>

<body data-page="dashboard">
  <main class="dashboard-page">

    <header class="dashboard-header">
      <div>
        <p class="eyebrow">
          DeskHub
        </p>

        <h1>
          Support Dashboard
        </h1>

        <p id="dashboardGreeting">
          Welcome back
        </p>
      </div>

      <div class="dashboard-actions">
        <a
          class="primary-link"
          href="../tickets.html"
        >
          View Tickets
        </a>
      </div>
    </header>

    <section
      class="dashboard-stats"
      aria-label="Ticket summary"
    >
      <article class="stat-card">
        <span>Total</span>
        <strong id="totalTickets">0</strong>
      </article>

      <article class="stat-card">
        <span>Open</span>
        <strong id="openTickets">0</strong>
      </article>

      <article class="stat-card">
        <span>In-Progress</span>
        <strong id="inProgressTickets">0</strong>
      </article>

      <article class="stat-card">
        <span>Resolved</span>
        <strong id="resolvedTickets">0</strong>
      </article>
    </section>

    <section class="dashboard-grid">
      <article class="dashboard-panel">
        <h2>Recent 5 Tickets</h2>

        <div
          id="recentTickets"
          class="recent-list"
        ></div>
      </article>

      <article class="dashboard-panel">
        <h2>Queue Snapshot</h2>

        <div
          id="statusBreakdown"
          class="metric-list"
        ></div>
      </article>
    </section>

    <p
      id="dashboardError"
      class="error-state"
      role="alert"
      hidden
    ></p>

  </main>

  <script
    type="module"
    src="../src/main.js"
  ></script>

</body>
</html>
