<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>DeskHub Login</title>

  <link
    rel="stylesheet"
    href="./styles/main.css"
  />
</head>

<body>

  <main class="login-container">

    <h1>DeskHub</h1>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        name="email"
        placeholder="Enter email"
        required
      />

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        name="password"
        placeholder="Enter password"
        required
      />

      <button type="submit">
        Login
      </button>

      <span
        id="error"
        role="alert"
        aria-live="polite"
      ></span>

    </form>

  </main>

  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
