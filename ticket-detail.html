<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <script>
    (function () {
      try {
        var raw = localStorage.getItem(
          "deskhub_theme"
        );
        if (!raw) return;
        var t = JSON.parse(raw);
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute(
            "data-theme",
            t
          );
        }
      } catch (e) {}
    })();
  </script>

  <title>Ticket Detail</title>

  <link
    rel="stylesheet"
    href="./styles/main.css"
  />
</head>

<body data-page="ticket-detail">

  <main class="detail-page">
    <header class="detail-header">
      <div>
        <a
          class="back-link"
          href="./tickets.html"
        >
          Back to tickets
        </a>

        <h1 id="ticketTitle">
          Ticket Detail
        </h1>
      </div>

      <div class="detail-actions">
        <button
          type="button"
          id="editTicketBtn"
          class="secondary-button"
        >
          Edit
        </button>

        <button
          type="button"
          id="cancelEditBtn"
          class="secondary-button"
          hidden
        >
          Cancel
        </button>

        <button
          type="button"
          id="saveTicketBtn"
          class="button-primary"
          hidden
        >
          Save changes
        </button>

        <button
          type="button"
          id="deleteTicketBtn"
          class="danger-button"
        >
          Delete
        </button>
      </div>
    </header>

    <div
      id="detailError"
      class="error-state"
      role="alert"
      hidden
    ></div>

    <section
      id="ticketInfo"
      class="detail-panel"
      aria-label="Ticket information"
    ></section>

    <section
      class="detail-panel"
      aria-labelledby="commentsTitle"
    >
      <h2 id="commentsTitle">
        Comments
      </h2>

      <div id="commentsList"></div>

      <form
        id="commentForm"
        class="comment-form"
      >
        <label for="commentBody">
          Add Comment
        </label>

        <textarea
          id="commentBody"
          name="body"
          rows="4"
          required
        ></textarea>

        <button type="submit">
          Add Comment
        </button>
      </form>
    </section>
  </main>

  <script
    type="module"
    src="./src/main.js"
  ></script>

</body>
</html>
