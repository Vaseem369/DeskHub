<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard</title>

  <link
    rel="stylesheet"
    href="./styles/main.css"
  />
</head>

<body>

  <div class="dashboard-container">

    <h1>
      Welcome to DeskHub Dashboard
    </h1>

    <p>
      Login successful
    </p>

    <button id="logoutBtn">
      Logout
    </button>

  </div>
  <script type="module">

  import {
    logout
  } from "./src/api/auth.js";

  const logoutBtn =
    document.querySelector(
      "#logoutBtn"
    );

  logoutBtn.addEventListener(
    "click",
    () => {

      logout();

      window.location.href =
        "./index.html";
    }
  );

</script>

</body>
</html>
